<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR Code Scanner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        main {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        #preview {
            min-height: 24px;
            margin: 0 0 16px;
            font-size: 16px;
            line-height: 1.5;
            color: #444;
        }

        #video-preview {
            display: block;
            width: 100%;
            max-width: 720px;
            height: auto;
            margin: 0 auto;
            border: 1px solid #ccc;
            border-radius: 12px;
            background: #000;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            h1 {
                font-size: 24px;
            }

            #video-preview {
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Scan a QR Code</h1>

        <div
            id="preview"
            role="status"
            aria-live="polite"
        >
            Loading camera...
        </div>

        <video
            id="video-preview"
            autoplay
            muted
            playsinline
        ></video>
    </main>

    <script type="module">
        import { BrowserQRCodeReader } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.0.10/+esm";

        const previewElement = document.getElementById("preview");
        const videoElement = document.getElementById("video-preview");

        const botUsername = "Jajda_com_bot";

        async function startScanner() {
            try {
                const devices =
                    await BrowserQRCodeReader.listVideoInputDevices();

                if (devices.length === 0) {
                    previewElement.textContent =
                        "❌ Camera not found.";

                    return;
                }

                previewElement.textContent =
                    "Camera is active. Point it at a QR code...";

                const codeReader = new BrowserQRCodeReader();

                const result =
                    await codeReader.decodeOnceFromVideoDevice(
                        undefined,
                        videoElement
                    );

                const qrPayload = result.getText().trim();

                if (!qrPayload) {
                    previewElement.textContent =
                        "❌ The QR code contains no data.";

                    return;
                }

                previewElement.textContent =
                    `✅ QR code scanned: ${qrPayload}`;

                // Forward the scanned payload to the Telegram bot.
                const telegramUrl =
                    `https://t.me/${botUsername}?start=${encodeURIComponent(qrPayload)}`;

                window.location.href = telegramUrl;

            } catch (error) {
                console.error("QR scanner error:", error);

                if (
                    error.name === "NotAllowedError" ||
                    error.name === "PermissionDeniedError"
                ) {
                    previewElement.textContent =
                        "❌ Camera access denied. Please allow camera access in your browser settings.";
                } else if (
                    error.name === "NotFoundError" ||
                    error.name === "DevicesNotFoundError"
                ) {
                    previewElement.textContent =
                        "❌ Camera not found.";
                } else {
                    previewElement.textContent =
                        "❌ Unable to start the QR code scanner.";
                }
            }
        }

        startScanner();
    </script>
</body>
</html>
